prefixes:
  edintinf: https://edint.es/def/infraestructura#
  schema: http://www.owl-ontologies.com/schema#
  edintmanagementrole: https://edint.es/kos/ManagementRoleType/

sources:
  rolDeGestion-source: ['Madrid_con_punto_observ_id.csv~csv']

mappings:
  rolDeGestion:
    sources:
      - rolDeGestion-source
    s: https://example.org/recurso/rol-de-gestion/$(rol) #
    po:
      - [a, edintinf:ManagementRole]
      - [edintinf:rolePlayedBy, "https://example.org/recurso/organizacion/$(company)~iri"] # Esto va a Organizacion
      - [edintinf:hasRoleType, "edintmanagementrole:$(rol)~iri"] # SKOS: basicservices, facilitysecurity, humanresources, maintenance
      - [edintinf:madeOnInfrastructure, "https://example.org/recurso/equipamiento-municipal/$(equipamiento_municipal)~iri"] # Esto va a equipamientoMunicipal
